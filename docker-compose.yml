# Local development infrastructure only. Not a production topology:
# ports are published to the host, and there is no TLS, no backup, no resource
# limit. Every credential comes from .env (which is gitignored) — nothing
# sensitive is hard-coded here.
#
# Host ports are configurable because 3306 is commonly already taken by a
# locally installed MySQL service. Default host port is therefore 3307.

name: marketplace

services:
  mysql:
    image: mysql:8.4
    container_name: marketplace-mysql
    restart: unless-stopped

    # Server-level charset. utf8mb4_unicode_ci is chosen deliberately to MATCH
    # the collation Prisma emits in its MySQL migrations
    # (`DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci`).
    # If the server defaulted to utf8mb4_0900_ai_ci, any table created outside
    # Prisma would get a different collation and JOINs across the boundary
    # would fail with "Illegal mix of collations".
    #
    # `--skip-character-set-client-handshake` used to sit here to force every
    # session onto the server charset regardless of what the client asked for.
    # MySQL 8.4 REMOVED that option (deprecated in 8.0.35), and an unknown
    # option is fatal: the server logs MY-000068 and aborts, which reads as a
    # crash loop under `restart: unless-stopped`. There is no 8.4 replacement,
    # and none is needed here -- the two settings below fix what CREATE TABLE
    # defaults to, which is what protects the collation, and every client in
    # this project negotiates utf8mb4 on its own (mysql2/Prisma default to it).
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

    environment:
      # `:?` makes compose fail fast with a readable message instead of
      # silently starting MySQL with an empty password.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-marketplace}
      # Not a stock MySQL variable — read by our init script below.
      MYSQL_SHADOW_DATABASE: ${MYSQL_SHADOW_DATABASE:-marketplace_shadow}
      # Also read by the init script, not by MySQL itself.
      MYSQL_TEST_DATABASE: ${MYSQL_TEST_DATABASE:-marketplace_test}

    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"

    volumes:
      - mysql-data:/var/lib/mysql
      # Runs ONLY on first initialisation, i.e. when mysql-data is empty.
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      # $$ escapes to a literal $ for the container's shell.
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      # MySQL 8.4 first boot initialises the data directory; do not start
      # counting failures until that has had time to finish.
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: marketplace-redis
    restart: unless-stopped

    # Persistence IS appropriate here: Redis holds the BullMQ queues. Losing it
    # does not lose orders (the Order row is the outbox and the sweeper
    # re-enqueues), but it does lose in-flight job scheduling — AOF keeps a
    # local restart from silently dropping queued work.
    command: ["redis-server", "--appendonly", "yes"]

    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  mysql-data:
    name: marketplace-mysql-data
  redis-data:
    name: marketplace-redis-data
